<!-- STRATEGY BUILDER MODAL -->
<div class="modal fade" id="addStratModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content text-white bg-card border-secondary">
            <div class="modal-header border-bottom border-secondary px-4 py-3">
                <h5 class="modal-title text-warning fw-bold"><i class="fa-solid fa-sliders me-2"></i> Strategy Architect</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="add-strat-form">
                    
                    <!-- 1. BUILDER MODE DROPDOWN -->
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">SELECT STRATEGY MODE</label>
                        <select id="strat-mode-select" class="form-select bg-input text-white">
                            <option value="ai" selected>🤖 AI Prompt Builder</option>
                            <option value="manual">⚙️ Custom Indicator Rules</option>
                            <option value="pinescript">📜 TradingView PineScript Code</option>
                        </select>
                    </div>

                    <!-- AI PROMPT INPUT -->
                    <div id="ai-section" class="p-3 mb-3 rounded border border-warning" style="background: rgba(240, 185, 11, 0.05);">
                        <label class="form-label text-warning small fw-bold mb-1"><i class="fa-solid fa-bolt me-1"></i> AI Prompt Auto-Fill</label>
                        <div class="input-group">
                            <input type="text" id="ai-prompt-input" class="form-control bg-input" placeholder="e.g. Buy BTC when RSI crosses below 30, Fast EMA 9 > Slow EMA 21">
                            <button class="btn btn-warning fw-bold px-3" type="button" onclick="parseAIStrategy()">Auto-Parse</button>
                        </div>
                    </div>

                    <!-- PINESCRIPT TEXTAREA -->
                    <div id="pine-section" class="mb-3 d-none">
                        <label class="form-label text-info small fw-bold"><i class="fa-solid fa-code me-1"></i> PineScript / Custom Script</label>
                        <textarea id="strat-pine" class="form-control bg-input font-monospace" rows="4" placeholder="// Paste PineScript strategy code here..."></textarea>
                    </div>

                    <!-- BASIC INFO -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label small text-muted fw-bold">STRATEGY NAME</label>
                            <input type="text" id="strat-name" class="form-control bg-input" placeholder="e.g. BTC Crossover Scalper" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small text-muted fw-bold">SYMBOL / PAIR</label>
                            <input type="text" id="strat-coin" class="form-control bg-input" placeholder="BTC or ETH" required>
                        </div>
                    </div>

                    <!-- 2. ENTRY & CROSSOVER RULES -->
                    <div class="p-3 mb-3 rounded border border-secondary bg-dark">
                        <h6 class="text-warning small fw-bold mb-3"><i class="fa-solid fa-right-to-bracket me-1"></i> ENTRY & CROSSOVER RULES</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small text-muted">RSI Entry Trigger (≤)</label>
                                <input type="number" id="strat-rsi" class="form-control bg-input" value="30">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Fast EMA Period</label>
                                <input type="number" id="strat-fast" class="form-control bg-input" value="9">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Slow EMA Period</label>
                                <input type="number" id="strat-slow" class="form-control bg-input" value="21">
                            </div>
                        </div>
                    </div>

                    <!-- 3. RISK MANAGEMENT & POSITION SIZE -->
                    <div class="p-3 mb-3 rounded border border-secondary bg-dark">
                        <h6 class="text-info small fw-bold mb-3"><i class="fa-solid fa-shield-halved me-1"></i> RISK & MONEY MANAGEMENT</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted">Trade Amount (% of Wallet)</label>
                                <div class="input-group">
                                    <input type="number" id="strat-amount-pct" class="form-control bg-input" value="5" min="1" max="100" required>
                                    <span class="input-group-text bg-secondary text-white border-0">%</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">Leverage (x)</label>
                                <select id="strat-leverage" class="form-select bg-input text-white">
                                    <option value="1">1x (Spot)</option>
                                    <option value="5">5x</option>
                                    <option value="10" selected>10x</option>
                                    <option value="20">20x</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Stop Loss (%)</label>
                                <input type="number" step="0.1" id="strat-sl" class="form-control bg-input" placeholder="1.5" value="1.5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Take Profit (%)</label>
                                <input type="number" step="0.1" id="strat-tp" class="form-control bg-input" placeholder="3.0" value="3.0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Risk-Reward (RR)</label>
                                <input type="text" id="strat-rr" class="form-control bg-input text-warning fw-bold" value="1:2.0" readonly>
                            </div>
                        </div>
                    </div>

                    <!-- AUTO-TRADE & SAVE -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary mt-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input bg-warning border-0 fs-5" type="checkbox" id="strat-autotrade" checked>
                            <label class="form-check-label fw-bold ms-2 align-middle text-white" for="strat-autotrade">Auto-Trade Market Crossover</label>
                        </div>
                        <input type="hidden" id="strat-edit-id" value="">
                        <button type="submit" id="save-strat-btn" class="btn btn-warning fw-bold px-4 py-2">Save Strategy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
