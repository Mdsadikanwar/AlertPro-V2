<!-- STRATEGY BUILDER MODAL -->
<div class="modal fade" id="addStratModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content text-white" style="background-color: #12161c; border: 1px solid #2b313a; border-radius: 16px;">
            <div class="modal-header border-bottom border-secondary px-4 py-3">
                <h5 class="modal-title text-warning fw-bold d-flex align-items-center">
                    <i class="fa-solid fa-sliders me-2"></i> Strategy Architect
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                
                <!-- 1. MODE SELECTION TABS -->
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold mb-2">SELECT BUILDER MODE</label>
                    <div class="btn-group w-100" role="group" id="strat-mode-selector">
                        <input type="radio" class="btn-check" name="stratMode" id="mode-ai" value="ai" checked>
                        <label class="btn btn-outline-warning fw-bold py-2" for="mode-ai"><i class="fa-solid fa-wand-magic-sparkles me-1"></i> AI Prompt</label>

                        <input type="radio" class="btn-check" name="stratMode" id="mode-manual" value="manual">
                        <label class="btn btn-outline-warning fw-bold py-2" for="mode-manual"><i class="fa-solid fa-sliders me-1"></i> Manual Rules</label>

                        <input type="radio" class="btn-check" name="stratMode" id="mode-template" value="template">
                        <label class="btn btn-outline-warning fw-bold py-2" for="mode-template"><i class="fa-solid fa-code me-1"></i> PineScript / Template</label>
                    </div>
                </div>

                <!-- AI PROMPT SECTION (Conditional) -->
                <div id="ai-section" class="p-3 mb-4 rounded" style="background: rgba(240, 185, 11, 0.05); border: 1px dashed #f0b90b;">
                    <label class="form-label text-warning small fw-bold mb-1"><i class="fa-solid fa-bolt me-1"></i> AI Prompt Auto-Fill</label>
                    <div class="input-group">
                        <input type="text" id="ai-prompt-input" class="form-control bg-input" placeholder="e.g. Buy BTC when RSI under 30 with 10x leverage, SL 1.5%, TP 3%">
                        <button class="btn btn-warning fw-bold px-3" type="button" onclick="parseAIStrategy()">Auto-Parse</button>
                    </div>
                </div>

                <!-- MAIN FORM -->
                <form id="add-strat-form">
                    
                    <!-- BASIC INFO -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label small text-muted fw-bold">STRATEGY NAME</label>
                            <input type="text" id="strat-name" class="form-control bg-input" placeholder="e.g. BTC Aggressive Scalper" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small text-muted fw-bold">PAIR / SYMBOL</label>
                            <input type="text" id="strat-coin" class="form-control bg-input" placeholder="BTC or ETH" required>
                        </div>
                    </div>

                    <!-- 2. ENTRY RULES -->
                    <div class="p-3 mb-3 rounded" style="background: #181a20; border: 1px solid #22272e;">
                        <h6 class="text-warning small fw-bold mb-3"><i class="fa-solid fa-right-to-bracket me-1"></i> ENTRY RULES</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small text-muted">RSI Buy Condition (≤)</label>
                                <input type="number" id="strat-rsi" class="form-control bg-input" value="30">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Fast EMA Period</label>
                                <input type="number" id="strat-fast" class="form-control bg-input" value="9">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Slow EMA Period</label>
                                <input type="number" id="strat-slow" class="form-control bg-input" value="21">
                            </div>
                        </div>
                    </div>

                    <!-- 3. EXIT RULES (SL, TP, RR) -->
                    <div class="p-3 mb-3 rounded" style="background: #181a20; border: 1px solid #22272e;">
                        <h6 class="text-danger small fw-bold mb-3"><i class="fa-solid fa-arrow-right-from-bracket me-1"></i> EXIT RULES</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Stop Loss (SL %)</label>
                                <input type="number" step="0.1" id="strat-sl" class="form-control bg-input" placeholder="1.5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Take Profit (TP %)</label>
                                <input type="number" step="0.1" id="strat-tp" class="form-control bg-input" placeholder="3.0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Target Risk-Reward (RR)</label>
                                <input type="text" id="strat-rr" class="form-control bg-input" placeholder="1:2" readonly>
                            </div>
                        </div>
                    </div>

                    <!-- 4. MONEY MANAGEMENT -->
                    <div class="p-3 mb-3 rounded" style="background: #181a20; border: 1px solid #22272e;">
                        <h6 class="text-info small fw-bold mb-3"><i class="fa-solid fa-calculator me-1"></i> MONEY MANAGEMENT</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted">Trade Amount ($ USDT)</label>
                                <input type="number" id="strat-amount" class="form-control bg-input" placeholder="50" value="50">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">Leverage (x)</label>
                                <select id="strat-leverage" class="form-select bg-input text-white">
                                    <option value="1">1x (Spot / No Leverage)</option>
                                    <option value="5">5x Leverage</option>
                                    <option value="10" selected>10x Leverage</option>
                                    <option value="20">20x Leverage</option>
                                    <option value="50">50x Leverage</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- PINESCRIPT TEMPLATE AREA (Conditional) -->
                    <div id="pine-section" class="mb-3 d-none">
                        <label class="form-label text-info small fw-bold"><i class="fa-solid fa-code me-1"></i> TradingView Pine Script Code</label>
                        <textarea id="strat-pine" class="form-control bg-input font-monospace" rows="4" placeholder="// Paste PineScript strategy code here..."></textarea>
                    </div>

                    <!-- 5. AUTO-TRADE & SAVE BUTTON ROW -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary mt-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input bg-warning border-0 fs-5" type="checkbox" id="strat-autotrade" checked>
                            <label class="form-check-label fw-bold ms-2 align-middle text-white" for="strat-autotrade">
                                Auto-Trade Enabled
                            </label>
                        </div>
                        <button type="submit" id="save-strat-btn" class="btn btn-warning fw-bold px-4 py-2 rounded-pill">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Strategy
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
