<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Strategy Maker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body class="p-4">

    <div class="container" style="max-width: 600px;">
        <h3 class="fw-bold text-primary mb-4">⚡ Crypto Strategy Maker</h3>

        <!-- Telegram Config -->
        <div class="card p-3 mb-4">
            <h5 class="fw-bold text-warning mb-3">1. Telegram Settings</h5>
            <div class="mb-3">
                <label class="form-label small">Bot Token</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="tg-token" placeholder="Bot Token from @BotFather">
            </div>
            <div class="mb-3">
                <label class="form-label small">Chat ID</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="tg-chatid" placeholder="-100xxxxxxxx or @channel">
            </div>
            <button class="btn btn-outline-info btn-sm" onclick="saveSettings()">Save Telegram Settings</button>
        </div>

        <!-- Strategy Creator -->
        <div class="card p-3 mb-4">
            <h5 class="fw-bold text-success mb-3">2. Active Strategy Config</h5>
            <div class="mb-3">
                <label class="form-label small">Coins to Scan (Comma Separated)</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="strat-coins" value="BTCUSDT, ETHUSDT, SOLUSDT">
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small">Stop Loss (%)</label>
                    <input type="number" step="0.1" class="form-control bg-dark text-light border-secondary" id="strat-sl" value="1.5">
                </div>
                <div class="col-6">
                    <label class="form-label small">Take Profit (%)</label>
                    <input type="number" step="0.1" class="form-control bg-dark text-light border-secondary" id="strat-tp" value="3.0">
                </div>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="strat-active" checked>
                <label class="form-check-label fw-bold" for="strat-active">Strategy Enabled (24x7 Scan ON)</label>
            </div>
            <button class="btn btn-success w-100" onclick="saveStrategy()">Save Strategy & Start Reader</button>
        </div>

        <div id="status-msg" class="text-center text-info small"></div>
    </div>

    <script>
        const KEY = 'simple_crypto_strategy';

        function loadData() {
            const raw = localStorage.getItem(KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            if (data.token) document.getElementById('tg-token').value = data.token;
            if (data.chatId) document.getElementById('tg-chatid').value = data.chatId;
            if (data.coins) document.getElementById('strat-coins').value = data.coins;
            if (data.sl) document.getElementById('strat-sl').value = data.sl;
            if (data.tp) document.getElementById('strat-tp').value = data.tp;
            if (data.active !== undefined) document.getElementById('strat-active').checked = data.active;
        }

        function getData() {
            return JSON.parse(localStorage.getItem(KEY) || '{}');
        }

        function saveSettings() {
            const data = getData();
            data.token = document.getElementById('tg-token').value.trim();
            data.chatId = document.getElementById('tg-chatid').value.trim();
            localStorage.setItem(KEY, JSON.stringify(data));
            document.getElementById('status-msg').innerText = "Telegram Settings Saved!";
        }

        function saveStrategy() {
            const data = getData();
            data.coins = document.getElementById('strat-coins').value.trim().toUpperCase();
            data.sl = parseFloat(document.getElementById('strat-sl').value);
            data.tp = parseFloat(document.getElementById('strat-tp').value);
            data.active = document.getElementById('strat-active').checked;
            localStorage.setItem(KEY, JSON.stringify(data));
            document.getElementById('status-msg').innerText = "Strategy Saved! 24x7 Engine Updated.";
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
