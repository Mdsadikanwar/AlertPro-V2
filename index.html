<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoSignal Pro - 24/7 Trading Engine</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #f8fafc; }
        .nav-pills .nav-link { color: #94a3b8; font-weight: 600; border-radius: 8px; cursor: pointer; }
        .nav-pills .nav-link.active { background-color: #3b82f6; color: #ffffff; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .table-dark { --bs-table-bg: #1e293b; --bs-table-border-color: #334155; }
        #tv_chart_container { height: 420px; width: 100%; border-radius: 10px; overflow: hidden; }
        .badge-buy { background-color: #10b981; color: #fff; }
        .badge-sell { background-color: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="navbar navbar-dark border-bottom border-secondary px-3 mb-4" style="background-color: #0b1120;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary fs-4" href="#">
                <i class="bi bi-currency-bitcoin text-warning"></i> CryptoSignal Pro
            </a>
            <div class="d-flex align-items-center gap-3">
                <span id="engine-status-badge" class="badge bg-success px-3 py-2"><i class="bi bi-cpu"></i> SCANNER LIVE</span>
                <button class="btn btn-sm btn-outline-light" onclick="manualScan()"><i class="bi bi-arrow-repeat"></i> Run Scan Now</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <!-- Main Navigation Tabs -->
        <ul class="nav nav-pills mb-4" id="appTabs">
            <li class="nav-item">
                <button class="nav-link active px-4 py-2" onclick="switchTab('dashboard', this)">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard & Chart
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link px-4 py-2" onclick="switchTab('settings', this)">
                    <i class="bi bi-gear me-1"></i> Telegram & Engine Settings
                </button>
            </li>
        </ul>

        <div class="tab-content">
            
            <!-- TAB 1: DASHBOARD & LIVE CHART -->
            <div class="tab-pane active" id="dashboard">
                <div class="row">
                    <!-- Left Column: TradingView Chart -->
                    <div class="col-lg-8 mb-4">
                        <div class="card p-3 shadow-sm">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="m-0 fw-bold text-info"><i class="bi bi-graph-up me-2"></i>Live Crypto Candlestick Chart</h5>
                                <div class="d-flex gap-2">
                                    <select id="chart-pair-select" class="form-select form-select-sm bg-dark text-light border-secondary" style="width: 140px;" onchange="updateChartPair(this.value)">
                                        <option value="BINANCE:BTCUSDT">BTC / USDT</option>
                                        <option value="BINANCE:ETHUSDT">ETH / USDT</option>
                                        <option value="BINANCE:SOLUSDT">SOL / USDT</option>
                                        <option value="BINANCE:XRPUSDT">XRP / USDT</option>
                                    </select>
                                </div>
                            </div>
                            <!-- Live Embedded TradingView Widget -->
                            <div id="tv_chart_container"></div>
                        </div>
                    </div>

                    <!-- Right Column: Quick Signals Feed -->
                    <div class="col-lg-4 mb-4">
                        <div class="card p-3 shadow-sm h-100">
                            <h5 class="fw-bold mb-3 text-warning"><i class="bi bi-bell me-2"></i>Latest Signals Feed</h5>
                            <div id="quick-signals-list" class="overflow-auto" style="max-height: 400px;">
                                <div class="text-center py-5 text-muted">
                                    <i class="bi bi-radar display-4 d-block mb-2"></i>
                                    Waiting for upcoming crypto signal...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Section: Strategy Cards & Controls -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold text-light m-0"><i class="bi bi-cpu-fill text-primary me-2"></i>Active Scan Strategies</h4>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStrategyModal">
                        <i class="bi bi-plus-lg me-1"></i> Create New Strategy
                    </button>
                </div>

                <div class="row mb-5" id="strategies-card-container">
                    <!-- Dynamic Strategy Cards render here -->
                </div>
            </div>

            <!-- TAB 2: SETTINGS -->
            <div class="tab-pane" id="settings">
                <div class="row">
                    <div class="col-md-8 mx-auto">
                        <div class="card p-4 shadow-sm">
                            <h4 class="fw-bold mb-4 text-primary"><i class="bi bi-telegram me-2"></i>Telegram Bot Integration</h4>
                            <form id="telegram-settings-form">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Telegram Bot Token</label>
                                    <input type="text" class="form-control bg-dark text-light border-secondary" id="cfg-tg-token" placeholder="e.g., 7123456789:AAFx...">
                                    <div class="form-text text-muted">Obtain token from @BotFather on Telegram.</div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Telegram Chat / Channel ID</label>
                                    <input type="text" class="form-control bg-dark text-light border-secondary" id="cfg-tg-chatid" placeholder="e.g., -1001987654321 or @your_channel">
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <button type="button" class="btn btn-outline-info" onclick="testTelegramAlert()">
                                        <i class="bi bi-send me-1"></i> Send Test Message
                                    </button>
                                    <button type="submit" class="btn btn-success px-4">
                                        <i class="bi bi-check-lg me-1"></i> Save Telegram Settings
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal: Add Strategy -->
    <div class="modal fade" id="addStrategyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="bi bi-diagram-3 me-2"></i>Add Crypto Strategy</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Strategy Name</label>
                        <input type="text" class="form-control bg-secondary text-light border-0" id="strat-name" placeholder="e.g. BTC RSI Breakout">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Crypto Coins (Comma Separated)</label>
                        <input type="text" class="form-control bg-secondary text-light border-0" id="strat-coins" value="BTCUSDT, ETHUSDT, SOLUSDT">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Stop Loss (%)</label>
                            <input type="number" step="0.1" class="form-control bg-secondary text-light border-0" id="strat-sl" value="1.5">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Take Profit (%)</label>
                            <input type="number" step="0.1" class="form-control bg-secondary text-light border-0" id="strat-tp" value="3.0">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createNewStrategy()">Save & Run Strategy</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TradingView Widget JS -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Logic Script -->
    <script src="assets/js/app.js"></script>
</body>
</html>
